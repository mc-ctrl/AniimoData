syntax = "proto2";

import "common.proto";
import "common_service.proto";

package phonest.proto;

option cc_generic_services = false;

// 出于优化Gate转发效率的考量，某些Message会拼凑多个字段，对通信的其中一方来说，可能存在不必要的字段
// 我们约定，当出现这种拼凑字段的Message时，会在注释中用以下方法说明字段的使用范围：
// All ：通信两端都会使用
// ClientOnly ：客户端会使用
// ServerOnly ：服务器会使用

message GameInfo {
	required bool banClient = 1;
	required ServerInfo srvinfo = 2;
}

message FilterInfo {
	required bytes sessionId = 1;  // Client连接标识
	optional bytes kvs = 2;        // 用于设置Filter的kv对
	optional bytes keys = 3;       // 用于取消Filter的keys
}

message FilterMessage {
	enum FilterType {
		All = 0;	     // 广播给所有人
		ByFilter = 1;    // 经过Filter后广播
		ByIds = 2;       // 广播给指定的SessionId列表
	}
	required FilterType type = 1;  // 广播消息的类型
	required bytes entityMsg = 2;  // 广播消息的内容
	optional bytes condition = 3;  // 过滤条件, 配合WithFilter使用
	optional bytes sessionIds = 4; // SessionId列表，配合ByIdList使用
}

// Gate2Game
service IGateGameService {
	rpc connectServer(ConnectServerReq) returns (Void);            // 转发Client连接Game的请求
	rpc entityMessage(EntityMessage) returns (Void);               // 转发Client调用Game Entity的RPC方法
	rpc forwardEntityMessage(ForwardEntityMessage) returns (Void); // 转发Game间的Entity的RPC方法
	rpc clientDisconnected(ClientInfo) returns (Void);             // Gate通知Game，客户端断开连接
	rpc regGateServer(GateInfo) returns(Void);                     // Gate向Game注册
	rpc channelMessage(ChannelMessage) returns (Void);             // 转发Client调用Game Entity的Channel RPC方法
	rpc forwardChannelMessage(ForwardChannelMessage) returns (Void);// 转发Game间的channel的RPC方法
	rpc heartbeat(Heartbeat) returns (Void);                       // Gate定期向Game发送的心跳包
	rpc entityMessage2C(EntityMessage2C) returns (Void);           // 转发Client调用Game Cpp Entity的RPC方法
	rpc attachChannel(AttachChannelInfo) returns (Void);           // 转发Game通知对端的Game进程创建Channel
	rpc attachChannelResponse(AttachChannelResp) returns (Void);   // 转发对端Game创建Channel的回复
	rpc migrate(MigrateInfo) returns (Void);                       // Soul迁移 
	rpc soulMessage(SoulMessage) returns (Void);     // service调用其他Game上的Soul的方法
	
	rpc MicroServiceResponse(MsResponse) returns (Void);
	rpc MicroServicePush(MsPush) returns (Void);
	rpc forwardPayload(ForwardPayload) returns (Void);             // 新转发协议：Gate透传payload，Game按targetMethod分发
}

// Game2Gate
service IGameGateService {
	rpc sendHotfix(HotfixType) returns (Void);         // 向Client发送Hotfix
	rpc connectResponse(ConnectServerResp) returns (Void);         // 对Client请求连接Game的回复
	rpc entityMessage(EntityMessage) returns (Void);               // Game调用Client Entity的RPC方法
	rpc forwardEntityMessage(ForwardEntityMessage) returns (Void); // Game调用其他Game上的Entity的RPC方法
	rpc createChannelEntity(ChannelEntityInfo) returns (Void);     // 通知Client创建ChannelEntity,ChannelEntity指拥有通信权的Entity，如Account、Avatar等
	rpc disconnectClient(ClientInfo) returns (Void);               // Game主动断开和Client的连接
	rpc bindAccount(BindAccountInfo) returns (Void);               // 通知客户端绑定Account
	rpc bindAvatar(BindAvatarInfo) returns (Void);                 // 通知客户端绑定Avatar
	rpc bindSoul(BindSoulInfo) returns (Void);                     // 通知客户端绑定Soul
	rpc unbindSoul(UnbindSoulInfo) returns (Void);                 // 通知客户端与Soul解绑
	rpc syncGameStatus(GameInfo) returns (Void);                   // 把Game的状态信息同步给Gate
	rpc channelMessage(ChannelMessage) returns (Void);             // Game调用Client Entity的Channel RPC方法
	rpc forwardChannelMessage(ForwardChannelMessage) returns (Void);// Game调用其他Game上的channel的RPC方法
	rpc setFilterKvs(FilterInfo) returns (Void);                   // 通知Gate设置玩家的Filter字段
	rpc unsetFilterKeys(FilterInfo) returns (Void);                // 通知Gate取消玩家的Filter字段
	rpc broadcastFilterMessage(FilterMessage) returns (Void);      // 通过Gate Filter发送广播消息 
	rpc recvHeartbeat(Heartbeat) returns (Void);                   // Game回复Gate的心跳包
	rpc entityMessage2C(EntityMessage2C) returns (Void);           // Game调用Client Cpp Entity的RPC方法
	rpc propertySync2Client(PropertySyncClientMessage) returns (Void); // 同步属性变化到客户端
	rpc propertyStrategySync2Client(PropertyStrategySyncClientMessage) returns (Void); // 基于策略的属性同步发送变化到客户端
	rpc attachChannel(AttachChannelInfo) returns (Void);           // Game通知对端的Game进程创建Channel
	rpc attachChannelResponse(AttachChannelResp) returns (Void);   // 对端Game创建Channel的回复
	rpc recoverChannelEntity(RecoverChannelEntityInfo) returns (Void); // 通知Client恢复ChannelEntity
	rpc createClientEntity(ClientEntityInfo) returns (Void);       // 通知客户端创建普通的ClientEntity
	rpc propertyIdSync2Client(PropertyIdSyncClientMessage) returns (Void);  // 同步属性的ID给客户端
	rpc migrate(MigrateInfo) returns (Void);                        // Soul迁移 
	rpc clientMessage(GlobalGate2ClientMessageInfo) returns(Void); // 微服务上直接向客户端发送消息
	rpc soulMessage(SoulMessage) returns (Void);     // service调用其他Game上的Soul的方法

	rpc MicroServiceRequest(MsRequest) returns (Void);			   // Game请求微服务
	rpc sendPropertyDeclare(PropertyDeclareType) returns (Void); // 向Client发送属性声明
	rpc forwardClientPayload(ForwardClientPayload) returns (Void); // 新转发协议：发给Client，Gate只看sessionId
	rpc forwardGamePayload(ForwardGamePayload) returns (Void);     // 新转发协议：发给Game，Gate只看serverName
}
